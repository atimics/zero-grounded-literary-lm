name: ZERO.4 retention controls

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: make -f Makefile.zero4-retention LITERARY_BACKEND=portable literary_lm build/literary_retention_lm freeze_literary_teacher export_literary quantity_request_eval
      - run: python3 scripts/check_zero4_retention_controls.py --out build/zero4-retention-smoke
