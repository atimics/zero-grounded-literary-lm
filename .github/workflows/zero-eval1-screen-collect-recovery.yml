name: Recover ZERO-EVAL-1 screen collection

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Immutable ZERO-EVAL-1 launch workflow run ID'
        required: true
        type: string
      failed_collector_run_id:
        description: 'Failed original collector workflow run ID'
        required: true
        type: string

permissions:
  id-token: write
  contents: write
  pull-requests: write

concurrency:
  group: zero-eval-1-screen-v1
  cancel-in-progress: false

jobs:
  collect:
    name: Administrative validation recovery · no compute
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: aws
    env:
      ZERO_BUCKET: ${{ secrets.AWS_BUCKET }}
      ZERO_REGION: ${{ secrets.AWS_REGION }}
      ZERO_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      ZERO_FAILED_COLLECTOR_RUN_ID: ${{ inputs.failed_collector_run_id }}
      ZERO_RECOVERY_RUN_ID: ${{ github.run_id }}
      ZERO_RECOVERY_COMMIT: ${{ github.sha }}
      ZERO_BUDGET_FILE: benchmarks/zero-eval-1/screen/aws/budget.json
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_TRAINING_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Validate and publish the frozen result
        run: bash scripts/aws/zero-eval1-screen-collect-recovery.sh
