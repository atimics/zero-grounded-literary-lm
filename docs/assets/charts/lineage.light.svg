<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" role="img"><title>How ZERO.4 was built</title><rect width="560" height="300" fill="#ffffff"/><text x="280.0" y="18" font-family="'DM Mono', ui-monospace, monospace" font-size="11" font-weight="500" fill="#1d1a14" text-anchor="middle">How ZERO.4 was built</text><text x="280.0" y="34" font-family="'DM Mono', ui-monospace, monospace" font-size="9" fill="#a39b8c" text-anchor="middle">Every earlier model stays loaded and frozen as a teacher; the student never averages weights</text><rect x="30.0" y="60.0" width="115.0" height="66.0" fill="#ffffff" stroke="#d8d3c8" stroke-width="1" rx="6"/><text x="87.5" y="78.0" font-family="'DM Mono', ui-monospace, monospace" font-size="11" font-weight="500" fill="#1d1a14" text-anchor="middle">ZERO.1</text><text x="87.5" y="93.0" font-family="'DM Mono', ui-monospace, monospace" font-size="8" font-weight="300" fill="#5c584f" text-anchor="middle">7,436-param</text><text x="87.5" y="104.0" font-family="'DM Mono', ui-monospace, monospace" font-size="8" font-weight="300" fill="#5c584f" text-anchor="middle">character MLP</text><text x="87.5" y="110.0" font-family="'DM Mono', ui-monospace, monospace" font-size="7" font-weight="300" fill="#a39b8c" text-anchor="middle">frozen teacher</text><text x="87.5" y="120.0" font-family="'DM Mono', ui-monospace, monospace" font-size="7" font-weight="300" fill="#a39b8c" text-anchor="middle">from update 20,000</text><rect x="200.0" y="60.0" width="115.0" height="66.0" fill="#ffffff" stroke="#d8d3c8" stroke-width="1" rx="6"/><text x="257.5" y="78.0" font-family="'DM Mono', ui-monospace, monospace" font-size="11" font-weight="500" fill="#1d1a14" text-anchor="middle">ZERO.2</text><text x="257.5" y="93.0" font-family="'DM Mono', ui-monospace, monospace" font-size="8" font-weight="300" fill="#5c584f" text-anchor="middle">4.85M literary</text><text x="257.5" y="104.0" font-family="'DM Mono', ui-monospace, monospace" font-size="8" font-weight="300" fill="#5c584f" text-anchor="middle">transformer</text><text x="257.5" y="110.0" font-family="'DM Mono', ui-monospace, monospace" font-size="7" font-weight="300" fill="#a39b8c" text-anchor="middle">frozen teacher</text><text x="257.5" y="120.0" font-family="'DM Mono', ui-monospace, monospace" font-size="7" font-weight="300" fill="#a39b8c" text-anchor="middle">update 12,600</text><rect x="370.0" y="60.0" width="115.0" height="66.0" fill="#ffffff" stroke="#d8d3c8" stroke-width="1" rx="6"/><text x="427.5" y="78.0" font-family="'DM Mono', ui-monospace, monospace" font-size="11" font-weight="500" fill="#1d1a14" text-anchor="middle">ZERO.3</text><text x="427.5" y="93.0" font-family="'DM Mono', ui-monospace, monospace" font-size="8" font-weight="300" fill="#5c584f" text-anchor="middle">distilled</text><text x="427.5" y="104.0" font-family="'DM Mono', ui-monospace, monospace" font-size="8" font-weight="300" fill="#5c584f" text-anchor="middle">integrator</text><text x="427.5" y="110.0" font-family="'DM Mono', ui-monospace, monospace" font-size="7" font-weight="300" fill="#a39b8c" text-anchor="middle">frozen teacher</text><text x="427.5" y="120.0" font-family="'DM Mono', ui-monospace, monospace" font-size="7" font-weight="300" fill="#a39b8c" text-anchor="middle">update 16,600</text><rect x="200.0" y="195.0" width="285.0" height="66.0" fill="#ffffff" stroke="#d8d3c8" stroke-width="1" rx="6"/><text x="342.5" y="213.0" font-family="'DM Mono', ui-monospace, monospace" font-size="11" font-weight="500" fill="#1d1a14" text-anchor="middle">ZERO.4</text><text x="342.5" y="228.0" font-family="'DM Mono', ui-monospace, monospace" font-size="8" font-weight="300" fill="#5c584f" text-anchor="middle">the deployed model — quantity faculty + tangent-projection guard</text><text x="342.5" y="245.0" font-family="'DM Mono', ui-monospace, monospace" font-size="7" font-weight="300" fill="#a39b8c" text-anchor="middle">promoted at update 500 (seed 2), replicated on seeds 1 and 3</text><line x1="145.0" y1="78.0" x2="200.0" y2="78.0" stroke="#a39b8c" stroke-width="1.2" opacity="1"/><path d="M 200.0 78.0 L 194.5 80.3 L 194.5 75.7 Z" fill="#a39b8c"/><text x="172.5" y="66.0" font-family="'DM Mono', ui-monospace, monospace" font-size="7" font-weight="300" fill="#a39b8c" text-anchor="middle">distills into</text><line x1="315.0" y1="78.0" x2="370.0" y2="78.0" stroke="#a39b8c" stroke-width="1.2" opacity="1"/><path d="M 370.0 78.0 L 364.5 80.3 L 364.5 75.7 Z" fill="#a39b8c"/><text x="342.5" y="66.0" font-family="'DM Mono', ui-monospace, monospace" font-size="7" font-weight="300" fill="#a39b8c" text-anchor="middle">distills into</text><line x1="87.5" y1="126.0" x2="310.0" y2="195.0" stroke="#a39b8c" stroke-width="1.2" opacity="1"/><path d="M 310.0 195.0 L 304.0 195.6 L 305.4 191.1 Z" fill="#a39b8c"/><text x="198.8" y="168.0" font-family="'DM Mono', ui-monospace, monospace" font-size="7" font-weight="300" fill="#a39b8c" text-anchor="middle">foundation target</text><line x1="257.5" y1="126.0" x2="330.0" y2="195.0" stroke="#a39b8c" stroke-width="1.2" opacity="1"/><path d="M 330.0 195.0 L 324.4 192.9 L 327.6 189.5 Z" fill="#a39b8c"/><text x="293.8" y="178.0" font-family="'DM Mono', ui-monospace, monospace" font-size="7" font-weight="300" fill="#a39b8c" text-anchor="middle">literary replay</text><line x1="427.5" y1="126.0" x2="420.0" y2="195.0" stroke="#a39b8c" stroke-width="1.2" opacity="1"/><path d="M 420.0 195.0 L 418.3 189.3 L 422.9 189.8 Z" fill="#a39b8c"/><text x="423.8" y="172.0" font-family="'DM Mono', ui-monospace, monospace" font-size="7" font-weight="300" fill="#a39b8c" text-anchor="middle">initializes + replay</text></svg>
